<!DOCTYPE html>

<html>

<head>

<title>
Smart Email Assistant
</title>


<link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">


<script type="module">

import {
pipeline
}
from 
"https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";


let classifier;


async function loadModel(){

classifier =
await pipeline(
"zero-shot-classification",
"Xenova/mobilebert-uncased-mnli"
);

}



window.previewTone=async function(){

let text=
document.getElementById(
"prompt"
).value;


if(!classifier)
return;


let result=
await classifier(
text,
[
"formal",
"casual",
"apology",
"request"
]
);


document.getElementById(
"preview"
).innerHTML=
"Instant tone: "
+
result.labels[0];


}



loadModel();


</script>


</head>


<body class="bg-light">


<div class="container mt-5">


<h2 class="mb-4">
Smart Email Generator & Reply Assistant
</h2>



<ul class="nav nav-tabs">


<li class="nav-item">

<button 
class="nav-link active"
data-bs-toggle="tab"
data-bs-target="#generate">

Generate New Email

</button>

</li>


<li class="nav-item">

<button 
class="nav-link"
data-bs-toggle="tab"
data-bs-target="#reply">

Suggest Reply

</button>

</li>


</ul>




<div class="tab-content mt-4">



<div class="tab-pane fade show active"
id="generate">


<form method="POST">


<input 
type="hidden"
name="mode"
value="generate">



<h5>
Quick Templates
</h5>


<button 
type="button"
class="btn btn-outline-primary"
onclick="
prompt.value='request a meeting with my manager'
">

Meeting

</button>


<button 
type="button"
class="btn btn-outline-primary"
onclick="
prompt.value='follow up on my previous email'
">

Follow-up

</button>



<button 
type="button"
class="btn btn-outline-primary"
onclick="
prompt.value='apologize for missing the deadline'
">

Apology

</button>



<button 
type="button"
class="btn btn-outline-primary"
onclick="
prompt.value='thank someone for their help'
">

Thank You

</button>




<textarea
id="prompt"
name="prompt"
class="form-control mt-3"
rows="5"
onkeyup="previewTone()"
placeholder="ask my landlord to fix the heater">

</textarea>



<p id="preview"
class="text-primary mt-2">

</p>



<button
class="btn btn-success mt-3">

Generate Email

</button>


</form>



</div>






<div class="tab-pane fade"
id="reply">


<form method="POST">


<input
type="hidden"
name="mode"
value="reply">


<textarea
name="incoming"
class="form-control"
rows="8"
placeholder="Paste incoming email">

</textarea>


<button
class="btn btn-warning mt-3">

Suggest Reply

</button>


</form>


</div>


</div>




{% if result %}

<hr>


<h4>
Generated Result
</h4>


<div class="card">

<div class="card-body">

<p>
Tone:
<b>
{{tone}}
</b>
</p>


<pre>
{{result}}
</pre>


</div>

</div>


{% endif %}



</div>



<script src=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
